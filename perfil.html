<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Scotty.App</title>
    <link rel="icon" type="image/png" href="img/ScottyFondoTransparente.png">
    <link rel="stylesheet" href="otros/estilos.css">
</head>
<body>
    <header>
        <nav>
            <a href="inicio.html" class="logo">
                <img src="img/ScottyFondoTransparente.png" alt="Logo de Scotty.App">
                <span>Scotty.App</span>
            </a>

            <div class="menu">
                <a href="inicio.html">Inicio</a>

                <details class="usuario-menu">
                    <summary><span class="nombre-usuario">Usuario</span></summary>
                    <div class="submenu">
                        <a href="perfil.html">Perfil</a>
                        <a href="acceso/signin.html" class="cerrar-sesion">Cerrar sesión</a>
                    </div>
                </details>
            </div>
        </nav>
    </header>

    <main>
        <a href="javascript:history.back()" class="volver-atras">&#8592; Volver</a>
        <section class="formulario perfil-datos">
            <h1>Perfil</h1>
            <p>Estos son los datos principales de tu cuenta.</p>

            <p><strong>Nombre:</strong> <span id="perfilNombre">Usuario</span></p>
            <p><strong>Usuario:</strong> <span id="perfilUsuario">Sin usuario</span></p>
            <p><strong>Correo:</strong> <span id="perfilCorreo">Sin correo</span></p>
            <p><strong>XP:</strong> <span id="perfilXp">0</span> puntos</p>
        </section>
    </main>

    <script src="otros/script.js"></script>
</body>
</html>
