<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Scotty.App</title>
    <link rel="icon" type="image/png" href="../../assets/img/ScottyFondoTransparente.png">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
</head>
<body>
    <header>
        <nav>
            <a href="../../index.html" class="logo">
                <img src="../../assets/img/ScottyFondoTransparente.png" alt="Logo de Scotty.App">
                <span>Scotty.App</span>
            </a>

            <div class="menu">
                <a href="signup.html">Registrarse</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h1>Iniciar sesión</h1>
            <p>Entra con tu cuenta para seguir ganando experiencia y puntos.</p>

            <form id="formSignin">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>

                <button type="submit">Entrar</button>
            </form>

            <p>
                ¿No tienes cuenta?
                <a href="signup.html">Regístrate</a>
            </p>
        </section>
    </main>
    <script src="../../assets/js/auth.js"></script>
</body>
</html>
